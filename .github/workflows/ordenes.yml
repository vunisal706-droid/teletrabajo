name: Exportar órdenes del día

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/exportar-ordenes.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/exportar-ordenes.js
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ordenes-del-dia.json
          git diff --cached --quiet || (git commit -m "Órdenes del día exportados" && git pull --rebase && git push)
